name: CI/CD

# main push   -> test, build, scan, push image, deploy to DEV (GitOps commit)
# v* tag push -> same, then deploy to PROD after manual approval
# pull request -> test + validate only (no push, no deploy)
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  KUSTOMIZE_VERSION: "5.4.3"
  KUBECONFORM_VERSION: "0.6.7"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: app

  validate-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize + kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin
      - name: Build and validate each overlay
        run: |
          for env in dev prod; do
            echo "::group::$env"
            kustomize build "k8s/overlays/$env" | kubeconform -strict -summary -kubernetes-version 1.29.0
            echo "::endgroup::"
          done

  build:
    name: Build, scan & push image
    needs: [test, validate-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tag
        id: vars
        run: |
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            docker tag  "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}" "${{ steps.vars.outputs.image }}:latest"
            docker push "${{ steps.vars.outputs.image }}:latest"
          fi

  # GitOps-style CD: CI never talks to the cluster. It bumps the image tag in
  # the overlay and commits; Argo CD (running inside the cluster) pulls and syncs.
  # Works for private/homelab clusters that GitHub can't reach.
  deploy-dev:
    name: Deploy to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump dev image tag
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          cd k8s/overlays/dev
          kustomize edit set image "webapp=${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}"
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "deploy(dev): ${{ needs.build.outputs.tag }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy-prod:
    name: Deploy to prod
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: production        # add required reviewers in repo settings
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump prod image tag
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          cd k8s/overlays/prod
          kustomize edit set image "webapp=${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}"
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "deploy(prod): ${{ needs.build.outputs.tag }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
