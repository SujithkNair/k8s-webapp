<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K8s CI/CD Demo</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#4ade80; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; }
    .kv span { display:block; font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
    .kv b { font-family: ui-monospace, Menlo, monospace; font-size:.9rem; word-break: break-all; }
    .env { display:inline-block; padding:2px 10px; border-radius:999px; background:var(--accent); color:#0f172a; font-weight:600; font-size:.8rem; }
    form { display:flex; gap:8px; }
    input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--text); }
    button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#0f172a; font-weight:600; cursor:pointer; }
    ul { list-style:none; padding:0; margin:16px 0 0; }
    li { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #334155; }
    li.done .t { text-decoration: line-through; color: var(--muted); }
    li .t { flex:1; cursor:pointer; }
    li button { background:transparent; color:var(--muted); padding:4px 8px; }
    .hint { color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
<main>
  <h1 id="appName">K8s CI/CD Demo</h1>
  <p class="sub">Served from Kubernetes by Sujith's pipeline &mdash; <span class="env" id="env">…</span></p>

  <section class="card">
    <div class="grid">
      <div class="kv"><span>Pod</span><b id="pod">…</b></div>
      <div class="kv"><span>Node</span><b id="node">…</b></div>
      <div class="kv"><span>Namespace</span><b id="ns">…</b></div>
      <div class="kv"><span>Version</span><b id="version">…</b></div>
      <div class="kv"><span>Git SHA</span><b id="sha">…</b></div>
      <div class="kv"><span>Uptime</span><b id="uptime">…</b></div>
    </div>
    <p class="hint">Refresh a few times — with multiple replicas the pod name changes as the Service load-balances.</p>
  </section>

  <section class="card">
    <form id="form">
      <input id="title" placeholder="Add a task (stored in this pod's memory)" maxlength="200" required>
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);

  async function loadInfo() {
    const i = await (await fetch('/api/info')).json();
    $('appName').textContent = i.appName;
    document.title = i.appName;
    $('env').textContent = i.environment;
    $('pod').textContent = i.pod;
    $('node').textContent = i.node;
    $('ns').textContent = i.namespace;
    $('version').textContent = i.version;
    $('sha').textContent = i.gitSha.slice(0, 12);
    $('uptime').textContent = i.uptimeSeconds + 's';
  }

  async function loadTasks() {
    const tasks = await (await fetch('/api/tasks')).json();
    const list = $('list');
    list.replaceChildren();
    for (const t of tasks) {
      const li = document.createElement('li');
      if (t.done) li.className = 'done';
      const span = document.createElement('span');
      span.className = 't';
      span.textContent = t.title;
      span.onclick = async () => { await fetch('/api/tasks/' + t.id, { method: 'PATCH' }); loadTasks(); };
      const del = document.createElement('button');
      del.textContent = '✕';
      del.title = 'Delete';
      del.onclick = async () => { await fetch('/api/tasks/' + t.id, { method: 'DELETE' }); loadTasks(); };
      li.append(span, del);
      list.append(li);
    }
  }

  $('form').onsubmit = async (e) => {
    e.preventDefault();
    const title = $('title').value.trim();
    if (!title) return;
    await fetch('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
    $('title').value = '';
    loadTasks();
  };

  loadInfo(); loadTasks();
</script>
</body>
</html>
