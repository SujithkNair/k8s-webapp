apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webapp-dev
resources:
  - namespace.yaml
  - ../../base
patches:
  # Expose on every node at :30080 so it works without an ingress controller.
  - target: { kind: Service, name: webapp }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target: { kind: Ingress, name: webapp }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.webapp.local
  - target: { kind: HorizontalPodAutoscaler, name: webapp }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
configMapGenerator:
  - name: webapp-config
    behavior: merge
    literals:
      - APP_ENV=dev
# CI updates this tag on every push to main.
images:
  - name: webapp
    newName: ghcr.io/sujithknair/k8s-webapp
    newTag: latest
