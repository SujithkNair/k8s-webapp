apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webapp-dev
resources:
- namespace.yaml
- ../../base
  # Expose on every node at :30080 so it works without an ingress controller.
patches:
- patch: |-
    - op: replace
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 30090
  target:
    kind: Service
    name: webapp
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: dev.webapp.local
  target:
    kind: Ingress
    name: webapp
- patch: |-
    - op: replace
      path: /spec/minReplicas
      value: 1
    - op: replace
      path: /spec/maxReplicas
      value: 3
  target:
    kind: HorizontalPodAutoscaler
    name: webapp
configMapGenerator:
- behavior: merge
  literals:
  - APP_ENV=dev
  name: webapp-config
# CI updates this tag on every push to main.
images:
- name: webapp
  newName: ghcr.io/sujithknair/k8s-webapp
  newTag: sha-5adbd8a
