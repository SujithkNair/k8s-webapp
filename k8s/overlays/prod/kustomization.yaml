apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webapp-prod
resources:
  - namespace.yaml
  - ../../base
patches:
  - target: { kind: Deployment, name: webapp }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 96Mi }
          limits: { memory: 192Mi }
  - target: { kind: Ingress, name: webapp }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: webapp.local
  - target: { kind: HorizontalPodAutoscaler, name: webapp }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target: { kind: PodDisruptionBudget, name: webapp }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
configMapGenerator:
  - name: webapp-config
    behavior: merge
    literals:
      - APP_ENV=prod
# CI updates this tag when a v* release tag is pushed.
images:
  - name: webapp
    newName: ghcr.io/sujithknair/k8s-webapp
    newTag: latest
